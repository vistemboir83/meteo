<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Météo Six-Fours-les-Plages</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Météo">
<style>
*{box-sizing:border-box}
html{font-size:calc(100vw / 150);font-size:min(100vw / 150, 100vh / 84);background:#0b2a40}
body{margin:0;height:100vh;overflow:hidden;cursor:default;font-family:"Avenir Next","Helvetica Neue",Helvetica,Arial,sans-serif;color:#f3f8fa;
  background:linear-gradient(180deg,#06121f 0%,#0b2a40 60%,#0e3a4f 100%);transition:background 2s}
body.day{background:linear-gradient(180deg,#14587f 0%,#2a8cab 60%,#5fb7c4 100%)}
body.wet.day{background:linear-gradient(180deg,#34495a 0%,#56707f 60%,#7c97a3 100%)}
body.wet.night{background:linear-gradient(180deg,#0a1118 0%,#16222c 60%,#1f3140 100%)}
#app{height:100vh;display:grid;grid-template-columns:36rem minmax(0,1fr);grid-template-rows:minmax(0,1fr) 10.2rem 12rem 14rem 1.3rem;grid-gap:.7rem;padding:1.1rem 1.3rem .3rem;padding-top:calc(1.1rem + env(safe-area-inset-top, 0px));padding-bottom:calc(.3rem + env(safe-area-inset-bottom, 0px))}
/* écrans tactiles (iPad) : on laisse de la place sous la barre d'état, que le système floute */
@media (hover:none) and (pointer:coarse){
  #app{padding-top:calc(3rem + env(safe-area-inset-top, 0px));padding-bottom:calc(2.5rem + env(safe-area-inset-bottom, 0px))}
}
.strip,.charts,.days,#status{grid-column:1/-1}
.card{background:rgba(255,255,255,.08);border-radius:.9rem}

/* colonne de gauche */
.side{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.place{font-size:1.7rem;font-weight:600}
#date{font-size:1.2rem;color:rgba(243,248,250,.75)}
.hrow{display:flex;align-items:center;justify-content:space-between;margin-top:.2rem}
#clock{font-size:6.2rem;line-height:1;font-weight:200;letter-spacing:-.02em;margin-top:.2rem;font-variant-numeric:tabular-nums}
.now{display:flex;align-items:center}
#icon{font-size:3.6rem;line-height:1;margin-right:.6rem}
#temp{font-size:5.4rem;line-height:1;font-weight:200;letter-spacing:-.03em}
#desc{font-size:1.6rem;font-weight:500;margin-top:.2rem}
#sub{font-size:1.15rem;color:rgba(243,248,250,.75);margin-top:.1rem}
.hi{color:#ffd27a}.lo{color:#a6e0ee}
.tiles{flex:1;min-height:0;margin-top:.7rem;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;grid-gap:.45rem}
.tile{background:rgba(255,255,255,.09);border-radius:.7rem;padding:.4rem .6rem;min-width:0;overflow:hidden}
.tile .l{font-size:.85rem;color:rgba(243,248,250,.68);white-space:nowrap}
.tile .v{font-size:1.45rem;font-weight:500;white-space:nowrap}
.tile .s{font-size:.8rem;color:rgba(243,248,250,.68);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* carte */
.map{display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;margin-bottom:.5rem}
.tab{font:inherit;font-size:1.05rem;color:#f3f8fa;background:rgba(255,255,255,.1);border:0;border-radius:2rem;padding:.35rem 1rem;margin-right:.45rem;cursor:pointer}
a.tab{text-decoration:none;display:inline-block}
.tab.on{background:#f3f8fa;color:#0b2a40;font-weight:600}
#map{flex:1;min-height:0;width:100%;border:0;border-radius:.9rem;background:rgba(255,255,255,.06)}

/* heure par heure */
.strip{display:flex;padding:.3rem .5rem;text-align:center;overflow:hidden}
.lab{flex:0 0 8.2rem;text-align:left;color:rgba(243,248,250,.62)}
.hcs{flex:1;min-width:0;display:grid;grid-template-columns:repeat(48,1fr)}
.hc{border-radius:.4rem;min-width:0}.hc.first{background:rgba(255,255,255,.14)}
.hc div,.lab div{height:1.2rem;line-height:1.2rem;font-size:.95rem;white-space:nowrap;overflow:hidden}
.lab div{font-size:.8rem}
.hc .h,.lab .h{height:1.4rem;line-height:1.4rem}.hc .h{font-weight:600;font-size:.85rem}
.hc .i,.lab .i{height:2rem;line-height:2rem}.hc .i{font-size:1.5rem}
.hc .t,.lab .t{height:1.6rem;line-height:1.6rem}.hc .t{font-size:1.15rem;font-weight:600}
.hc .p{color:#9fd8ff}.hc .p.z{color:rgba(243,248,250,.4)}

/* graphiques */
.charts{display:grid;grid-template-columns:repeat(4,1fr);grid-gap:.7rem}
.ch{padding:.5rem .8rem .3rem;display:flex;flex-direction:column;min-width:0}
.ct{display:flex;justify-content:space-between;font-size:1rem}
.ct b{font-weight:600}.ct span{color:rgba(243,248,250,.7)}
.cb{position:relative;flex:1;min-height:0;margin-bottom:1.1rem}
.cb svg{position:absolute;left:0;top:0;width:100%;height:100%}
.cb em{position:absolute;bottom:-1.15rem;font-style:normal;font-size:.8rem;color:rgba(243,248,250,.6);transform:translateX(-50%)}

/* 10 jours */
.days{display:grid;grid-template-columns:repeat(10,1fr);grid-gap:.5rem}
.day{padding:.4rem .3rem;text-align:center;min-width:0}
.day.today{background:rgba(255,255,255,.18)}
.dn{font-size:1.15rem;font-weight:600}.di{font-size:2.2rem;line-height:2.8rem}
.dd{font-size:.85rem;color:rgba(243,248,250,.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dt{font-size:1.4rem;font-weight:600}.dt .lo{font-size:1.15rem;font-weight:400;margin-left:.4rem}
.bar{height:.35rem;border-radius:.2rem;background:rgba(255,255,255,.15);margin:.3rem .6rem .35rem;position:relative}
.bar i{position:absolute;top:0;bottom:0;border-radius:.2rem;background:linear-gradient(90deg,#a6e0ee,#ffd27a)}
.dl{font-size:.88rem;color:rgba(243,248,250,.78);line-height:1.2rem;white-space:nowrap}.dl.rn{color:#9fd8ff}
#status{font-size:.8rem;color:rgba(243,248,250,.5);text-align:right}#status.err{color:#ffb3a0}
</style>
</head>
<body class="night">
<div id="app">
  <div class="side">
    <div class="place">Six-Fours-les-Plages</div>
    <div id="date">&nbsp;</div>
    <div class="hrow"><div id="clock">--:--</div>
    <div class="now"><div id="icon"></div><div id="temp">--°</div></div></div>
    <div id="desc">Chargement…</div>
    <div id="sub"></div>
    <div class="tiles" id="tiles"></div>
  </div>
  <div class="map"><div class="tabs" id="tabs"></div><iframe id="map" title="Carte météo"></iframe></div>
  <div class="strip card" id="strip"></div>
  <div class="charts" id="charts"></div>
  <div class="days" id="days"></div>
  <div id="status"></div>
</div>

<script>
(function () {
  var LAT = 43.0939, LON = 5.8392;
  var FC = 'https://api.open-meteo.com/v1/forecast?latitude=' + LAT + '&longitude=' + LON +
    '&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,cloud_cover,pressure_msl,wind_speed_10m,wind_direction_10m,wind_gusts_10m,is_day' +
    '&hourly=temperature_2m,apparent_temperature,relative_humidity_2m,dew_point_2m,precipitation_probability,precipitation,weather_code,pressure_msl,cloud_cover,visibility,wind_speed_10m,wind_gusts_10m,is_day' +
    '&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,daylight_duration,uv_index_max,precipitation_sum,precipitation_probability_max,wind_speed_10m_max,wind_gusts_10m_max' +
    '&wind_speed_unit=kmh&timezone=Europe%2FParis&past_days=1&forecast_days=10';
  var MARINE = 'https://marine-api.open-meteo.com/v1/marine?latitude=' + LAT + '&longitude=' + LON +
    '&current=wave_height,wave_period,sea_surface_temperature&timezone=Europe%2FParis';
  var AIR = 'https://air-quality-api.open-meteo.com/v1/air-quality?latitude=' + LAT + '&longitude=' + LON +
    '&current=european_aqi,pm2_5,pm10,ozone&timezone=Europe%2FParis';
  var OVERLAYS = [['wind', 'Vent'], ['rain', 'Pluie'], ['temp', 'Température'], ['clouds', 'Nuages'], ['pressure', 'Pression'], ['waves', 'Vagues']];
  var DAYS = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];
  var DS = ['dim.', 'lun.', 'mar.', 'mer.', 'jeu.', 'ven.', 'sam.'];
  var MONTHS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
  var COMPASS = ['N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE', 'S', 'SSO', 'SO', 'OSO', 'O', 'ONO', 'NO', 'NNO'];
  var overlay = 'wind', timer = null, lastData = null, marine = null, air = null;

  function $(id) { return document.getElementById(id); }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function r(n) { return Math.round(n); }
  function f1(n) { return (Math.round(n * 10) / 10).toString().replace('.', ','); }
  function hm(s) { return s.substr(11, 2) + 'h' + s.substr(14, 2); }
  function dow(s) { var p = s.substr(0, 10).split('-'); return new Date(+p[0], +p[1] - 1, +p[2]).getDay(); }

  function wmo(c, day) {
    switch (c) {
      case 0: return day ? ['☀️', 'Ensoleillé'] : ['🌙', 'Ciel dégagé'];
      case 1: return day ? ['🌤️', 'Plutôt dégagé'] : ['🌙', 'Plutôt dégagé'];
      case 2: return day ? ['⛅', 'Éclaircies'] : ['☁️', 'Nuageux'];
      case 3: return ['☁️', 'Couvert'];
      case 45: case 48: return ['🌫️', 'Brouillard'];
      case 51: case 53: case 55: return ['🌦️', 'Bruine'];
      case 56: case 57: return ['🌧️', 'Bruine verglaçante'];
      case 61: return ['🌦️', 'Pluie faible'];
      case 63: return ['🌧️', 'Pluie'];
      case 65: return ['🌧️', 'Forte pluie'];
      case 66: case 67: return ['🌧️', 'Pluie verglaçante'];
      case 71: case 73: case 75: case 77: return ['🌨️', 'Neige'];
      case 80: return ['🌦️', 'Averses'];
      case 81: case 82: return ['🌧️', 'Fortes averses'];
      case 85: case 86: return ['🌨️', 'Averses de neige'];
      case 95: return ['⛈️', 'Orage'];
      case 96: case 99: return ['⛈️', 'Orage et grêle'];
      default: return ['❔', '—'];
    }
  }
  function uvLabel(u) { return u < 3 ? 'Faible' : u < 6 ? 'Modéré' : u < 8 ? 'Élevé' : u < 11 ? 'Très élevé' : 'Extrême'; }

  /* ---------- horloge ---------- */
  function tick() {
    var d = new Date(), j = DAYS[d.getDay()];
    $('clock').textContent = pad(d.getHours()) + ':' + pad(d.getMinutes());
    $('date').textContent = j.charAt(0).toUpperCase() + j.slice(1) + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear();
  }

  /* ---------- carte Windy ---------- */
  function mapUrl() {
    return 'https://embed.windy.com/embed2.html?lat=' + LAT + '&lon=' + LON + '&detailLat=' + LAT + '&detailLon=' + LON +
      '&zoom=8&level=surface&overlay=' + overlay + '&product=' + (overlay === 'waves' ? 'ecmwfWaves' : 'ecmwf') + '&menu=&message=true&marker=true&calendar=now&pressure=&type=map&location=coordinates&detail=&metricWind=km%2Fh&metricTemp=%C2%B0C&radarRange=-1';
  }
  function buildTabs() {
    var h = '';
    for (var i = 0; i < OVERLAYS.length; i++) {
      h += '<button class="tab' + (OVERLAYS[i][0] === overlay ? ' on' : '') + '" data-o="' + OVERLAYS[i][0] + '">' + OVERLAYS[i][1] + '</button>';
    }
    h += '<a class="tab" style="margin-left:auto" target="_blank" href="https://www.windy.com/' + LAT + '/' + LON + '?' + LAT + ',' + LON + ',8">Ouvrir Windy ↗</a>';
    $('tabs').innerHTML = h;
  }
  $('tabs').addEventListener('click', function (e) {
    var o = e.target.getAttribute('data-o');
    if (!o) { return; }
    overlay = o; buildTabs(); $('map').src = mapUrl();
  });

  /* ---------- graphique SVG ---------- */
  function chart(title, unit, times, series, bars) {
    var N = times.length, W = 480, H = 100, all = [], i, k, s = '', lab = '';
    for (k = 0; k < series.length; k++) { all = all.concat(series[k].v); }
    var mn = Math.min.apply(null, all), mx = Math.max.apply(null, all);
    if (mx - mn < 1) { mx = mn + 1; }
    function X(i) { return i / (N - 1) * W; }
    function Y(v) { return H - ((v - mn) / (mx - mn)) * H * 0.78 - H * 0.1; }
    if (bars) {
      var bm = Math.max(2, Math.max.apply(null, bars.v)), bw = W / N * 0.7;
      for (i = 0; i < N; i++) {
        var bh = bars.v[i] / bm * H * 0.45;
        s += '<rect x="' + (X(i) - bw / 2) + '" y="' + (H - bh) + '" width="' + bw + '" height="' + bh + '" fill="' + bars.c + '" opacity=".55"/>';
      }
    }
    for (i = 0; i < N; i++) {
      var hr = +times[i].substr(11, 2);
      if (hr === 0) { s += '<line x1="' + X(i) + '" x2="' + X(i) + '" y1="0" y2="' + H + '" stroke="rgba(255,255,255,.3)" stroke-dasharray="3" vector-effect="non-scaling-stroke"/>'; }
      if (hr % 6 === 0) { lab += '<em style="left:' + (X(i) / W * 100) + '%">' + (hr === 0 ? DS[dow(times[i])] : hr + 'h') + '</em>'; }
    }
    for (k = 0; k < series.length; k++) {
      var d = '';
      for (i = 0; i < N; i++) { d += (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(series[k].v[i]).toFixed(1); }
      s += '<path d="' + d + '" fill="none" stroke="' + series[k].c + '" stroke-width="2.4" stroke-linejoin="round"' +
        (series[k].dash ? ' stroke-dasharray="5 4"' : '') + ' vector-effect="non-scaling-stroke"/>';
    }
    var main = series[0].v;
    return '<div class="ch card"><div class="ct"><b>' + title + '</b><span>' + r(Math.min.apply(null, main)) + ' à ' + r(Math.max.apply(null, main)) + ' ' + unit + '</span></div>' +
      '<div class="cb"><svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">' + s + '</svg>' + lab + '</div></div>';
  }

  function airTile() {
    if (!air || air.european_aqi == null) { return ['Qualité de l’air', '—', 'Indisponible']; }
    var a = air.european_aqi, k = a < 20 ? 0 : a < 40 ? 1 : a < 60 ? 2 : a < 80 ? 3 : a < 100 ? 4 : 5;
    var names = ['Bon', 'Correct', 'Modéré', 'Mauvais', 'Très mauvais', 'Extrême'];
    var cols = ['#7be0a4', '#c8e66f', '#ffd27a', '#ffa36b', '#ff7a7a', '#d59bff'];
    return ['Qualité de l’air', '<span style="color:' + cols[k] + '">' + names[k] + '</span>',
      'Indice ' + r(a) + ' · PM2,5 ' + f1(air.pm2_5 == null ? 0 : air.pm2_5)];
  }

  function airTile2() {
    if (!air || air.pm2_5 == null) { return ['Particules PM2,5 / PM10', '—', 'Indisponible']; }
    return ['Particules PM2,5 / PM10', f1(air.pm2_5) + ' / ' + f1(air.pm10 == null ? 0 : air.pm10),
      'µg/m³' + (air.ozone == null ? '' : ' · Ozone ' + r(air.ozone))];
  }

  /* ---------- affichage ---------- */
  function render(d) {
    var c = d.current, h = d.hourly, dl = d.daily, i, j;
    var key = c.time.substr(0, 13), idx = -1;
    for (i = 0; i < h.time.length; i++) { if (h.time[i].substr(0, 13) === key) { idx = i; break; } }
    if (idx < 0) { idx = 24; }
    var di = 0, tk = c.time.substr(0, 10);
    for (i = 0; i < dl.time.length; i++) { if (dl.time[i] === tk) { di = i; break; } }

    var isDay = c.is_day === 1, w = wmo(c.weather_code, isDay);
    document.body.className = (isDay ? 'day' : 'night') + (c.weather_code >= 51 ? ' wet' : '');
    $('icon').textContent = w[0];
    $('temp').textContent = r(c.temperature_2m) + '°';
    $('desc').textContent = w[1];
    $('sub').innerHTML = 'Ressenti ' + r(c.apparent_temperature) + '° &nbsp;·&nbsp; <span class="hi">▲ ' + r(dl.temperature_2m_max[di]) + '°</span> &nbsp;<span class="lo">▼ ' + r(dl.temperature_2m_min[di]) + '°</span>';

    var arrow = '→', trend = 'stable';
    if (idx >= 3) {
      var df = c.pressure_msl - h.pressure_msl[idx - 3];
      if (df > 1) { arrow = '↗'; trend = 'en hausse'; } else if (df < -1) { arrow = '↘'; trend = 'en baisse'; }
    }
    var rain24 = 0;
    for (i = idx; i < idx + 24 && i < h.precipitation.length; i++) { rain24 += h.precipitation[i] || 0; }
    var uv = dl.uv_index_max[di], dur = dl.daylight_duration[di];
    var sea = marine && marine.sea_surface_temperature != null ? r(marine.sea_surface_temperature * 10) / 10 : null;
    var wave = marine && marine.wave_height != null ? marine.wave_height : null;
    var tiles = [
      ['Humidité', c.relative_humidity_2m + ' %', 'Rosée ' + r(h.dew_point_2m[idx]) + '°'],
      ['Pression', r(c.pressure_msl) + ' hPa', arrow + ' ' + trend],
      ['Vent', r(c.wind_speed_10m) + ' km/h', COMPASS[Math.round(c.wind_direction_10m / 22.5) % 16] + ' (' + r(c.wind_direction_10m) + '°)'],
      ['Rafales', r(c.wind_gusts_10m) + ' km/h', 'Max jour ' + r(dl.wind_gusts_10m_max[di])],
      ['Pluie 24 h', f1(rain24) + ' mm', 'Maintenant ' + f1(c.precipitation)],
      ['Nuages', c.cloud_cover + ' %', ''],
      ['Visibilité', f1(h.visibility[idx] / 1000) + ' km', ''],
      ['Indice UV max', r(uv), uvLabel(uv)],
      ['Durée du jour', Math.floor(dur / 3600) + 'h' + pad(Math.round(dur % 3600 / 60)), ''],
      ['Lever', hm(dl.sunrise[di]), ''],
      ['Coucher', hm(dl.sunset[di]), ''],
      ['Mer', sea === null ? '—' : f1(sea) + '°', 'Température de l’eau'],
      ['Vagues', wave === null ? '—' : f1(wave) + ' m', marine && marine.wave_period != null ? 'Période ' + r(marine.wave_period) + ' s' : ''],
      airTile(),
      airTile2()
    ];
    var th = '';
    for (i = 0; i < tiles.length; i++) {
      th += '<div class="tile"><div class="l">' + tiles[i][0] + '</div><div class="v">' + tiles[i][1] + '</div><div class="s">' + (tiles[i][2] || '&nbsp;') + '</div></div>';
    }
    $('tiles').innerHTML = th;

    // 48 heures
    var hs = '';
    for (i = idx; i < idx + 48 && i < h.time.length; i++) {
      var hw = wmo(h.weather_code[i], h.is_day[i] === 1), hr = +h.time[i].substr(11, 2), pp = h.precipitation_probability[i];
      hs += '<div class="hc' + (i === idx ? ' first' : '') + '"><div class="h">' + (i === idx ? 'Maint.' : hr === 0 ? DS[dow(h.time[i])] : hr + 'h') + '</div><div class="i">' + hw[0] +
        '</div><div class="t">' + r(h.temperature_2m[i]) + '°</div><div class="p' + (pp === 0 ? ' z' : '') + '">' + pp + '</div><div>' + h.relative_humidity_2m[i] +
        '</div><div>' + r(h.pressure_msl[i]) + '</div><div>' + r(h.wind_speed_10m[i]) + '</div></div>';
    }
    $('strip').innerHTML = '<div class="lab"><div class="h">&nbsp;</div><div class="i">&nbsp;</div><div class="t">Température °C</div><div>Pluie %</div><div>Humidité %</div><div>Pression hPa</div><div>Vent km/h</div></div><div class="hcs">' + hs + '</div>';

    // graphiques sur 48 h
    function sl(a) { return a.slice(idx, idx + 48); }
    var T = sl(h.time);
    $('charts').innerHTML =
      chart('Température et pluie', '°C', T, [{ v: sl(h.temperature_2m), c: '#ffd27a' }, { v: sl(h.apparent_temperature), c: '#a6e0ee', dash: 1 }], { v: sl(h.precipitation), c: '#8fd0ff' }) +
      chart('Vent et rafales', 'km/h', T, [{ v: sl(h.wind_speed_10m), c: '#ffffff' }, { v: sl(h.wind_gusts_10m), c: '#ffb27a', dash: 1 }]) +
      chart('Pression', 'hPa', T, [{ v: sl(h.pressure_msl), c: '#c9b6ff' }]) +
      chart('Humidité et nuages', '%', T, [{ v: sl(h.relative_humidity_2m), c: '#8fe3c0' }, { v: sl(h.cloud_cover), c: '#cfd8dc', dash: 1 }]);

    // 10 jours
    var last = Math.min(di + 10, dl.time.length), gmin = 100, gmax = -100, ds = '';
    for (j = di; j < last; j++) {
      gmin = Math.min(gmin, dl.temperature_2m_min[j]); gmax = Math.max(gmax, dl.temperature_2m_max[j]);
    }
    var span = (gmax - gmin) || 1;
    for (j = di; j < last; j++) {
      var dw = wmo(dl.weather_code[j], true);
      var left = (dl.temperature_2m_min[j] - gmin) / span * 100;
      var wd = Math.max(8, (dl.temperature_2m_max[j] - dl.temperature_2m_min[j]) / span * 100);
      if (left + wd > 100) { left = 100 - wd; }
      ds += '<div class="day card' + (j === di ? ' today' : '') + '"><div class="dn">' + (j === di ? 'Aujourd’hui' : DS[dow(dl.time[j])] + ' ' + (+dl.time[j].substr(8, 2))) + '</div><div class="di">' + dw[0] +
        '</div><div class="dd">' + dw[1] + '</div><div class="dt"><span class="hi">' + r(dl.temperature_2m_max[j]) + '°</span><span class="lo">' + r(dl.temperature_2m_min[j]) + '°</span></div>' +
        '<div class="bar"><i style="left:' + left + '%;width:' + wd + '%"></i></div>' +
        '<div class="dl rn">Pluie ' + dl.precipitation_probability_max[j] + ' % · ' + f1(dl.precipitation_sum[j]) + ' mm</div>' +
        '<div class="dl">Vent ' + r(dl.wind_speed_10m_max[j]) + ' km/h</div><div class="dl">UV ' + r(dl.uv_index_max[j]) + '</div></div>';
    }
    $('days').innerHTML = ds;
  }

  /* ---------- chargement ---------- */
  function status(m, err) { var s = $('status'); s.textContent = m; s.className = err ? 'err' : ''; }
  function schedule(ms) { if (timer) { clearTimeout(timer); } timer = setTimeout(load, ms); }
  function load() {
    fetch(MARINE).then(function (x) { return x.json(); }).then(function (m) {
      marine = m.current || null; if (lastData) { render(lastData); }
    }).catch(function () { marine = null; });
    fetch(AIR).then(function (x) { return x.json(); }).then(function (a) {
      air = a.current || null; if (lastData) { render(lastData); }
    }).catch(function () { air = null; });
    fetch(FC).then(function (x) { if (!x.ok) { throw new Error('HTTP ' + x.status); } return x.json(); }).then(function (d) {
      lastData = d; render(d);
      var n = new Date();
      status('Mis à jour à ' + pad(n.getHours()) + 'h' + pad(n.getMinutes()) + ' · données Open-Meteo · carte Windy', false);
      $('map').src = mapUrl();
      schedule(15 * 60 * 1000);
    }).catch(function () {
      status('Connexion impossible, nouvel essai dans 1 minute', true);
      schedule(60 * 1000);
    });
  }

  buildTabs();
  $('map').src = mapUrl();
  tick(); setInterval(tick, 1000);
  load();
  document.addEventListener('visibilitychange', function () { if (!document.hidden) { tick(); load(); } });
})();
</script>
</body>
</html>
